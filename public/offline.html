<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCFrame 离线</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: "Noto Serif SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fafaf9;
        color: #0a0a0a;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        max-width: 520px;
        padding: 32px 28px;
        border-radius: 20px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #e63946;
        margin-bottom: 10px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #3f3f46;
      }
      .action {
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        background: #e63946;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">CCFrame</span>
      <h1>当前处于离线状态</h1>
      <p>网络恢复后即可继续浏览最新作品与系列内容。</p>
      <button class="action" type="button" onclick="window.location.reload()">重试连接</button>
    </div>
  </body>
</html>
